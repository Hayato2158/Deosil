<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="./assets/scripts/legacy-redirect.js"></script>
    <title>Deosil - Login</title>
    <link rel="stylesheet" href="./assets/style/login.css" />

    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.ico/icon-32.png" />
    <link rel="icon" href="./favicon.ico" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- iOS-icons -->
    <link rel="apple-touch-icon" href="./icons/pwa/apple-touch-icon.png" />
    <!-- PWA enable for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>

<body>
    <main class="container">
        <h1>Deosil</h1>

        <section class="card hero">
            <h2>ログイン</h2>

            <div class="form">
                <label class="field">
                    <span class="muted">Email</span>
                    <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" />
                </label>

                <label class="field">
                    <span class="muted">Password</span>
                    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="********" />
                </label>

                <p id="loginError" class="hint loginError"></p>

                <div class="actions">
                    <button id="btnLogin" class="btn btnStart" type="button">ログイン</button>
                </div>
            </div>
        </section>
    </main>

    <script src="./assets/scripts/config.js"></script>

    <script src="./assets/scripts/core.js"></script>
    <script src="./assets/scripts/idb.js"></script>
    <script src="./assets/scripts/sb.js"></script>

    <script src="./assets/scripts/login.js"></script>
</body>

</html>
