<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Deosil</title>
    <link rel="stylesheet" href="./assets/style/style.css" />
    <link rel="stylesheet" href="./assets/style/dialog.css" />
    <link rel="stylesheet" href="./assets/style/settings.css" />

    <!-- favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.ico/icon-32.png" />
    <link rel="icon" href="./favicon.ico" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- iOS-icons -->
    <link rel="apple-touch-icon" href="./icons/pwa/apple-touch-icon.png" />
    <!-- PWA enable for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>

<body>

    <main class="container">
        <h1>Deosil</h1>

        <!-- Settings -->
        <section class="card">
            <h2>通知</h2>
            <span>通知を有効にする</span>

            <label class="switch">
                <input type="checkbox" id="pushEnabledToggle">
                <span class="slider">
                    <svg class="slider-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                        role="presentation">
                        <path fill="none" d="m4 16.5 8 8 16-16"></path>
                    </svg>
                </span>
            </label>

            <p id="pushHint"></p>
        </section>



        <!-- ボトムナビ -->
        <nav class="bottomNav" aria-label="bottom navigation">
            <a href="./home.html" class="tab">
                <span class="tabIcon">🏠</span>
                <span class="tabLabel">Home</span>
            </a>
            <a href="./data.html" class="tab">
                <span class="tabIcon">📄</span>
                <span class="tabLabel">Data</span>
            </a>
            <a href="./settings.html" class="tab active">
                <span class="tabIcon">⚙</span>
                <span class="tabLabel">Settings</span>
            </a>
            <a href="#" class="tab" id="issueTab">
                <span class="tabIcon">💡</span>
                <span class="tabLabel">Issue</span>
            </a>
        </nav>
    </main>

    <div id="issueDialog" class="dialog hidden">
        <div class="dialogCard">
            <h3>ご要望・不具合報告</h3>
            <p>
                Googleフォームに移動します<br>
            </p>
            <div class="dialogActions">
                <button class="btn primary" id="issueGo">フォームへ進む</button>
                <button class="btn cancel" id="issueCancel">キャンセル</button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/scripts/config.js"></script>

    <script src="./assets/scripts/core.js"></script>
    <script src="./assets/scripts/idb.js"></script>
    <script src="./assets/scripts/sb.js"></script>

    <script src="./assets/scripts/home.js"></script>
    <script src="./assets/scripts/dialog.js"></script>
    <script defer src="./assets/scripts/settings.js"></script>
</body>

</html>
